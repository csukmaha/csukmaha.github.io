<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unreal Engine 5 City Builder Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: "Tech Learn Palette" - A combination of slate grays for a professional feel, with a sky blue accent for interactive elements and highlights. -->
    <!-- Application Structure Plan: The SPA is designed with a fixed sidebar for module navigation and a dynamic main content area. This structure provides a persistent, clear navigation path, allowing learners to explore course content methodically. -->
    <!-- Visualization & Content Choices: 
        - Course Overview: Report Info -> Full course structure. Goal -> Organize/Inform. Viz/Method -> A grid of interactive cards, one for each module. Interaction -> Clicking a card navigates to the detailed module view.
        - Module Duration Comparison: Report Info -> Duration of each module in weeks. Goal -> Compare. Viz/Method -> A horizontal bar chart. Interaction -> Tooltips on hover display the exact duration.
        - Module Details (Objectives, Topics, Project): Report Info -> Detailed text content for each module. Goal -> Inform. Viz/Method -> Accordion-style collapsible sections for each topic. Interaction -> Click to expand/collapse.
        - Recommended Resources: Report Info -> List of tools and links. Goal -> Inform. Viz/Method -> A styled list within a distinct card. Interaction -> Static display. Justification -> Consolidate external references in one place.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 350px;
            max-height: 400px;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r border-slate-200 p-6 hidden md:flex flex-col">
            <h1 class="text-xl font-bold text-slate-900 mb-8">UE5 City Builder</h1>
            <nav id="sidebar-nav" class="flex flex-col space-y-2">
                <a href="#overview" data-module="overview" class="nav-link text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium rounded-md px-3 py-2 transition-colors duration-200 bg-slate-100 text-slate-900">
                    <span class="mr-2">🏠</span> Course Overview
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <div id="content-area" class="w-full max-w-7xl mx-auto">
                <!-- Content will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <script>
        const courseData = {
            modules: [
                { 
                    id: 1, 
                    title: "UE5 Fundamentals", 
                    duration: 2, 
                    icon: "🛠️", 
                    objectives: [
                        "Understand the Unreal Engine 5 interface and navigation.",
                        "Master basic asset import and management.",
                        "Learn Blueprint fundamentals and visual scripting.",
                        "Create and modify basic actors in the world."
                    ],
                    topics: [
                        {
                            title: "Engine Interface & Navigation",
                            points: [
                                "Main viewport, outliner, and details panel overview",
                                "Basic camera controls and viewport navigation",
                                "Project settings and preferences",
                                "Content browser organization and asset management"
                            ]
                        },
                        {
                            title: "Asset Import & Management",
                            points: [
                                "Importing 3D models, textures, and materials",
                                "Setting up material instances",
                                "Managing asset libraries and folder structures",
                                "Working with Quixel Megascans"
                            ]
                        },
                        {
                            title: "Blueprint Basics",
                            points: [
                                "Creating your first Blueprint class",
                                "Variables, functions, and events",
                                "Basic node graph workflow",
                                "Testing and debugging Blueprints"
                            ]
                        },
                        {
                            title: "Creating & Placing Actors",
                            points: [
                                "Spawning actors in the world",
                                "Transform properties (position, rotation, scale)",
                                "Actor components and attachments",
                                "Basic actor lifecycle"
                            ]
                        }
                    ],
                    project: "Create a simple scene with multiple imported assets, add basic Blueprint actors with simple behaviors, and implement basic interactions."
                },
                { 
                    id: 2, 
                    title: "World Building & Camera", 
                    duration: 2, 
                    icon: "🌍", 
                    objectives: [
                        "Develop skills in creating large-scale landscapes.",
                        "Implement a city-builder specific camera system.",
                        "Master terrain sculpting and material application.",
                        "Create an engaging visual environment."
                    ],
                    topics: [
                        {
                            title: "Landscape Creation",
                            points: [
                                "Creating and sculpting landscapes",
                                "Height map import and editing",
                                "Landscape layers and materials",
                                "Performance optimization for large terrains"
                            ]
                        },
                        {
                            title: "City-Builder Camera System",
                            points: [
                                "Isometric or top-down camera setup",
                                "Camera panning and zoom mechanics",
                                "Camera constraints and bounds",
                                "Smooth camera transitions"
                            ]
                        },
                        {
                            title: "Environmental Materials",
                            points: [
                                "Creating realistic material networks",
                                "Blending terrain textures",
                                "Environmental lighting basics",
                                "Weather and time-of-day systems"
                            ]
                        },
                        {
                            title: "Scene Layout",
                            points: [
                                "Placing decorative elements and landmarks",
                                "Creating visual hierarchy",
                                "Water bodies and environmental features",
                                "Optimizing draw calls"
                            ]
                        }
                    ],
                    project: "Build a large-scale city landscape with varied terrain, implement a functional city-builder camera system with zoom and pan, and apply realistic materials to the environment."
                },
                { 
                    id: 3, 
                    title: "Placement & Grid Systems", 
                    duration: 3, 
                    icon: "🏗️", 
                    objectives: [
                        "Design and implement a grid-based building system.",
                        "Create dynamic placement previews.",
                        "Manage building validation and snap-to-grid mechanics.",
                        "Optimize placement logic for performance."
                    ],
                    topics: [
                        {
                            title: "Grid System Foundation",
                            points: [
                                "Defining grid size and alignment",
                                "World-to-grid coordinate conversion",
                                "Storing grid cell data structures",
                                "Efficient grid queries and searches"
                            ]
                        },
                        {
                            title: "Building Placement Mechanics",
                            points: [
                                "Ray casting for placement detection",
                                "Real-time placement preview rendering",
                                "Valid/invalid placement visualization",
                                "Snap-to-grid logic"
                            ]
                        },
                        {
                            title: "Validation & Collision",
                            points: [
                                "Overlap detection and validation",
                                "Cost calculation and resource checking",
                                "Placement constraints (terrain, obstacles)",
                                "Build zone restrictions"
                            ]
                        },
                        {
                            title: "Performance Optimization",
                            points: [
                                "Spatial acceleration structures (quadtrees, grids)",
                                "Batch collision checks",
                                "Memory-efficient grid storage",
                                "Profiling placement systems"
                            ]
                        }
                    ],
                    project: "Implement a fully functional grid-based placement system with real-time preview, validation feedback, and optimized performance for placing dozens of buildings simultaneously."
                },
                { 
                    id: 4, 
                    title: "Resource Management", 
                    duration: 3, 
                    icon: "💰", 
                    objectives: [
                        "Implement a resource collection and consumption system.",
                        "Create a basic in-game economy (money, production, costs).",
                        "Design resource UI and notifications.",
                        "Balance resource flow mechanics."
                    ],
                    topics: [
                        {
                            title: "Resource System Architecture",
                            points: [
                                "Resource types and storage",
                                "Production and consumption logic",
                                "Resource generation from buildings",
                                "Storage limits and overflow handling"
                            ]
                        },
                        {
                            title: "Economic Systems",
                            points: [
                                "Currency and budget management",
                                "Building costs and maintenance fees",
                                "Revenue generation mechanics",
                                "Budget tracking and reporting"
                            ]
                        },
                        {
                            title: "Resource UI Display",
                            points: [
                                "HUD resource display",
                                "Resource graphs and charts",
                                "Warning indicators for low resources",
                                "Tooltips and information panels"
                            ]
                        },
                        {
                            title: "Game Balance & Economy",
                            points: [
                                "Balancing income vs. expenses",
                                "Difficulty scaling",
                                "Resource bottlenecks",
                                "Progression pacing"
                            ]
                        }
                    ],
                    project: "Build a complete resource management system with multiple resource types, production chains, economic balance, and a UI that clearly displays all resource metrics and changes in real-time."
                },
                { 
                    id: 5, 
                    title: "Citizen & AI Basics", 
                    duration: 3, 
                    icon: "🤖", 
                    objectives: [
                        "Introduce basic AI for citizens or simulation agents.",
                        "Implement simple needs and behaviors.",
                        "Create pathfinding and movement systems.",
                        "Design agent-building interactions."
                    ],
                    topics: [
                        {
                            title: "Agent Architecture",
                            points: [
                                "Agent actor setup and components",
                                "Agent state machines",
                                "Behavior tree basics",
                                "Perception and sensory systems"
                            ]
                        },
                        {
                            title: "Pathfinding & Navigation",
                            points: [
                                "Navigation mesh creation and setup",
                                "A* pathfinding implementation",
                                "Dynamic obstacle avoidance",
                                "Crowd behavior simulation"
                            ]
                        },
                        {
                            title: "Agent Needs & Behaviors",
                            points: [
                                "Defining agent needs (hunger, rest, happiness)",
                                "Need decay and fulfillment",
                                "Decision-making based on needs",
                                "Behavior priority systems"
                            ]
                        },
                        {
                            title: "Building & Agent Interaction",
                            points: [
                                "Agents using buildings and services",
                                "Activity zones and interaction points",
                                "Task queuing at buildings",
                                "Service satisfaction tracking"
                            ]
                        }
                    ],
                    project: "Create a population of AI-driven citizens that navigate your city, fulfill needs by visiting appropriate buildings, and demonstrate visible behaviors and emotional states based on city management decisions."
                },
                { 
                    id: 6, 
                    title: "Advanced Systems & Polish", 
                    duration: 3, 
                    icon: "✨", 
                    objectives: [
                        "Implement a robust Save/Load system.",
                        "Add more complex building functionalities.",
                        "Refine the user experience with animations and effects.",
                        "Integrate audio and visual feedback systems."
                    ],
                    topics: [
                        {
                            title: "Save & Load System",
                            points: [
                                "Serializing game state to files",
                                "Saving and loading actor transforms",
                                "Saving game progress and statistics",
                                "Version management and migration"
                            ]
                        },
                        {
                            title: "Advanced Building Features",
                            points: [
                                "Building upgrades and variants",
                                "Building destruction and damage",
                                "Visual feedback systems",
                                "Building-specific gameplay mechanics"
                            ]
                        },
                        {
                            title: "Polish & Effects",
                            points: [
                                "UI animations and transitions",
                                "Particle effects and visual feedback",
                                "Building placement celebration effects",
                                "Selection and hover effects"
                            ]
                        },
                        {
                            title: "Audio Integration",
                            points: [
                                "UI sound effects",
                                "Building construction sounds",
                                "Ambient audio and music systems",
                                "Audio feedback for resource changes"
                            ]
                        }
                    ],
                    project: "Add professional polish to the game including a fully functional save/load system, advanced building upgrade mechanics, comprehensive audio design, and refined visual effects that enhance player immersion and satisfaction."
                },
                { 
                    id: 7, 
                    title: "Optimization & Deployment", 
                    duration: 1, 
                    icon: "🚀", 
                    objectives: [
                        "Understand basic optimization techniques for UE5 games.",
                        "Learn the process of packaging a game for distribution.",
                        "Profile and debug performance issues.",
                        "Prepare the game for release."
                    ],
                    topics: [
                        {
                            title: "Performance Profiling",
                            points: [
                                "Using UE5 profiling tools",
                                "Identifying performance bottlenecks",
                                "GPU and CPU profiling",
                                "Memory usage analysis"
                            ]
                        },
                        {
                            title: "Optimization Techniques",
                            points: [
                                "LOD systems and detail reduction",
                                "Draw call batching and instancing",
                                "Asset compression and streaming",
                                "Memory management best practices"
                            ]
                        },
                        {
                            title: "Packaging & Distribution",
                            points: [
                                "Packaging for Windows, Mac, or Linux",
                                "Setting up distribution platforms",
                                "Version control and release management",
                                "Post-launch support strategies"
                            ]
                        },
                        {
                            title: "Quality Assurance",
                            points: [
                                "Testing on target hardware",
                                "Bug reporting and tracking",
                                "User feedback collection",
                                "Patch planning and deployment"
                            ]
                        }
                    ],
                    project: "Profile and optimize your complete city-builder game for target platforms, package the final build, and prepare documentation for release including performance metrics and known limitations."
                }
            ],
            resources: [
                { title: "Unreal Engine 5", description: "The primary development environment." },
                { title: "Blueprint Visual Scripting", description: "Will be the main scripting language." },
                { title: "Quixel Bridge & Megascans", description: "For high-quality assets." },
                { title: "Blender (Optional)", description: "For custom 3D modeling if you want to create unique assets." },
                { title: "Official Unreal Engine Documentation", description: "Essential for reference." },
                { title: "Unreal Engine Learning Portal", description: "Offers structured courses and tutorials." },
                { title: "YouTube Channels", description: "Virtus Learning Hub, Ryan Laley, Unreal Sensei, and specific city-builder tutorials." },
                { title: "Unreal Engine Forums & Discord", description: "For community support and problem-solving." }
            ]
        };

        const contentArea = document.getElementById('content-area');
        const sidebarNav = document.getElementById('sidebar-nav');
        let durationChart = null;

        function renderOverview() {
            contentArea.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-slate-900 mb-2">Course Overview</h2>
                    <p class="text-lg text-slate-600">A complete learning path to build a city-builder game in Unreal Engine 5.</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
                    <h3 class="text-xl font-semibold text-slate-800 mb-4">Module Duration (Weeks)</h3>
                    <div class="chart-container">
                        <canvas id="durationChart"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    ${courseData.modules.map(module => `
                        <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer" onclick="navigateToModule(${module.id})">
                            <div class="flex items-center mb-4">
                                <span class="text-3xl mr-4">${module.icon}</span>
                                <div>
                                    <p class="text-sm font-semibold text-sky-600">Module ${module.id}</p>
                                    <h4 class="text-lg font-bold text-slate-800">${module.title}</h4>
                                </div>
                            </div>
                            <p class="text-slate-600 text-sm">${module.duration} weeks</p>
                        </div>
                    `).join('')}
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-xl font-semibold text-slate-800 mb-4">Recommended Tools & Resources</h3>
                    <ul class="space-y-3">
                        ${courseData.resources.map(resource => `
                            <li class="flex items-start">
                                <span class="text-sky-500 mr-3 mt-1">✓</span>
                                <div>
                                    <h5 class="font-semibold text-slate-700">${resource.title}</h5>
                                    <p class="text-slate-500 text-sm">${resource.description}</p>
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            renderChart();
        }

        function renderModule(moduleId) {
            const module = courseData.modules.find(m => m.id === moduleId);
            if (!module) {
                renderOverview();
                return;
            }

            contentArea.innerHTML = `
                <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm">
                    <div class="flex items-start mb-6">
                        <span class="text-5xl mr-6">${module.icon}</span>
                        <div>
                            <p class="text-md font-semibold text-sky-600">Module ${module.id}</p>
                            <h2 class="text-3xl font-bold text-slate-900">${module.title}</h2>
                            <p class="text-slate-500 mt-1">${module.duration} Week Duration</p>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-2">Learning Objectives</h3>
                        <ul class="list-disc list-inside space-y-2 text-slate-600">
                            ${module.objectives.map(obj => `<li>${obj}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-2">Topics Covered</h3>
                        <div class="space-y-4">
                            ${module.topics.map((topic, index) => `
                                <details class="group bg-slate-50 rounded-lg p-4" ${index === 0 ? 'open' : ''}>
                                    <summary class="font-semibold text-slate-700 cursor-pointer list-none flex justify-between items-center">
                                        ${topic.title}
                                        <span class="text-slate-400 group-open:rotate-90 transition-transform duration-200">▶</span>
                                    </summary>
                                    <ul class="mt-3 list-disc list-inside space-y-1 text-slate-600 text-sm pl-2">
                                        ${topic.points.map(point => `<li>${point}</li>`).join('')}
                                    </ul>
                                </details>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-2">Module Project</h3>
                        <div class="bg-sky-50 text-sky-800 p-4 rounded-lg border border-sky-200">
                            <p>${module.project}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderChart() {
            const ctx = document.getElementById('durationChart');
            if (!ctx) return;

            if (durationChart) {
                durationChart.destroy();
            }

            const labels = courseData.modules.map(m => `Module ${m.id}: ${m.title}`);
            const data = courseData.modules.map(m => m.duration);

            durationChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Duration in Weeks',
                        data: data,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: 'rgba(14, 165, 233, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: {
                                size: 14,
                                weight: 'bold'
                            },
                            bodyFont: {
                                size: 12
                            },
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.x !== null) {
                                        label += context.parsed.x + ' weeks';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            grid: {
                                color: '#e2e8f0'
                            },
                            ticks: {
                                color: '#64748b'
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#334155',
                                callback: function(value, index, values) {
                                    const label = this.getLabelForValue(value);
                                    if (label.length > 25) {
                                        return label.substring(0, 25) + '...';
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateActiveLink(targetModule) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-slate-100', 'text-slate-900');
                if (link.dataset.module === targetModule) {
                    link.classList.add('bg-slate-100', 'text-slate-900');
                }
            });
        }

        function navigateToModule(moduleId) {
            const moduleStr = `module-${moduleId}`;
            window.location.hash = moduleStr;
            renderModule(moduleId);
            updateActiveLink(moduleStr);
        }

        function handleNavigation() {
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('module-')) {
                const moduleId = parseInt(hash.split('-')[1]);
                renderModule(moduleId);
                updateActiveLink(hash);
            } else {
                renderOverview();
                updateActiveLink('overview');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            courseData.modules.forEach(module => {
                const link = document.createElement('a');
                link.href = `#module-${module.id}`;
                link.dataset.module = `module-${module.id}`;
                link.className = 'nav-link text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium rounded-md px-3 py-2 transition-colors duration-200';
                link.innerHTML = `<span class="mr-2">${module.icon}</span> Module ${module.id}`;
                sidebarNav.appendChild(link);
            });

            sidebarNav.addEventListener('click', (e) => {
                const link = e.target.closest('.nav-link');
                if (link) {
                    e.preventDefault();
                    const targetModule = link.dataset.module;
                    window.location.hash = targetModule;
                    handleNavigation();
                }
            });

            window.addEventListener('hashchange', handleNavigation);
            handleNavigation();
        });
    </script>
</body>
</html>
