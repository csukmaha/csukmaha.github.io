<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Bookmark</title>
  <style>
    :root {
      --ink: #f8f4ff;
      --muted: #b9afd0;
      --accent: #ff6b8a;
      --accent-2: #8d7aff;
      --page: #fffaf3;
      --cover: #241d3d;
      --cover-side: #171226;
      --panel: rgba(17, 12, 28, .78);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow: auto;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 18% 15%, rgba(141,122,255,.28), transparent 30%), radial-gradient(circle at 84% 80%, rgba(255,107,138,.2), transparent 28%), #0e0a1b;
    }
    .scene { min-height: 100vh; display: grid; place-items: center; perspective: 1400px; padding: 2rem; }
    .layout { width: min(100%, 1120px); display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(2rem, 6vw, 5rem); align-items: center; }
    .intro { max-width: 450px; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: .7rem 0 1rem; font-size: clamp(3rem, 7vw, 5.8rem); line-height: .9; letter-spacing: -.08em; }
    h1 span { display: block; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.65); }
    p { color: var(--muted); line-height: 1.7; max-width: 35ch; }
    .hint { display: inline-flex; gap: .55rem; align-items: center; margin-top: 1rem; color: var(--ink); font-size: .82rem; }
    .hint::before { content: ""; width: 2.4rem; height: 1px; background: var(--accent); }
    .panel { width: min(100%, 540px); padding: 1.25rem; border: 1px solid rgba(255,255,255,.12); border-radius: 22px; background: var(--panel); box-shadow: 0 24px 60px rgba(0,0,0,.35); backdrop-filter: blur(14px); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .panel-header h2 { margin: 0; font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; }
    .pill { padding: .45rem .7rem; border: 1px solid rgba(255,107,138,.35); border-radius: 999px; background: rgba(255,107,138,.14); color: #ffdfe8; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
    form { display: grid; gap: .8rem; margin-bottom: 1.25rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    label { display: grid; gap: .45rem; color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    input, button { font: inherit; }
    input { width: 100%; padding: .8rem 1rem; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; outline: none; background: rgba(255,255,255,.03); color: var(--ink); }
    input:focus { border-color: rgba(141,122,255,.75); box-shadow: 0 0 0 3px rgba(141,122,255,.15); }
    .actions, .item-actions { display: flex; gap: .55rem; flex-wrap: wrap; }
    .btn { padding: .75rem .9rem; border: 0; border-radius: 12px; cursor: pointer; font-weight: 700; transition: transform .15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #ff8ea1); color: white; box-shadow: 0 12px 22px rgba(255,107,138,.28); }
    .btn-secondary { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: var(--ink); }
    .btn-danger { border: 1px solid rgba(255,143,162,.32); background: rgba(255,143,162,.14); color: #ffd9e2; }
    .list { display: grid; gap: .75rem; list-style: none; margin: 0; padding: 0; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: .8rem; padding: .9rem 1rem; border: 1px solid rgba(255,255,255,.07); border-radius: 14px; background: rgba(255,255,255,.03); }
    .item-main { display: grid; gap: .2rem; min-width: 0; }
    .item-title { overflow: hidden; color: var(--ink); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .item-link { overflow: hidden; color: #d1c5ff; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .empty-state { padding: 1rem; border: 1px dashed rgba(255,255,255,.14); border-radius: 12px; color: var(--muted); text-align: center; }

    .book-wrap { position: relative; width: min(100%, 390px); aspect-ratio: 1 / 1.1; display: grid; place-items: center; transform-style: preserve-3d; transform: rotateX(8deg) rotateY(-18deg) rotateZ(2deg); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
    .book-wrap:hover { transform: rotateX(4deg) rotateY(-2deg) rotateZ(0deg) translateY(-8px); }
    .book-shadow { position: absolute; width: 80%; height: 12%; bottom: 9%; left: 10%; background: #000; opacity: .45; filter: blur(22px); transform: rotate(-8deg) translateZ(-70px); border-radius: 50%; }
    .book { position: relative; width: 72%; height: 69%; transform-style: preserve-3d; filter: drop-shadow(18px 22px 16px rgba(0,0,0,.28)); }
    .cover, .pages, .spine { position: absolute; inset: 0; border-radius: 7px 13px 13px 7px; }
    .cover { border: 1px solid rgba(255,255,255,.17); background: linear-gradient(135deg, #392d62, var(--cover)); transform: translateZ(22px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset -15px -12px 28px rgba(0,0,0,.2); }
    .cover::before { content: ""; position: absolute; inset: 10%; border: 1px solid rgba(255,255,255,.24); border-radius: 4px 10px 10px 4px; }
    .cover::after { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; color: #ffd9e2; font-size: 4rem; text-shadow: 0 0 22px var(--accent); }
    .pages { border: 1px solid #ded1c5; background: repeating-linear-gradient(0deg, #fffaf3 0 3px, #e8ded2 3px 4px); transform: translateZ(7px) translateX(6px); }
    .pages::after { content: ""; position: absolute; top: 4%; bottom: 4%; left: 7%; width: 3px; background: rgba(70,48,80,.16); }
    .spine { width: 22px; left: -16px; right: auto; border-radius: 5px 0 0 5px; background: linear-gradient(90deg, var(--cover-side), #302653); transform-origin: right center; transform: rotateY(-90deg) translateZ(11px); }
    .ribbon { position: absolute; z-index: 5; left: 47%; top: 50%; width: 30px; height: 68%; background: linear-gradient(90deg, #ff456e, var(--accent)); transform: translateZ(27px) rotate(2deg); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 87%, 0 100%); box-shadow: 4px 6px 10px rgba(0,0,0,.22); }
    .bookmark-card { position: absolute; z-index: 6; right: -2%; top: 8%; width: 33%; height: 66%; padding: 1.2rem .8rem; display: flex; flex-direction: column; justify-content: space-between; align-items: center; color: #211835; text-align: center; background: linear-gradient(150deg, #ffe9ee, #ff9eb3); border-radius: 5px 7px 12px 5px; transform: translateZ(53px) rotate(7deg); box-shadow: 15px 18px 22px rgba(0,0,0,.28), inset 2px 0 rgba(255,255,255,.7); }
    .bookmark-card::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 16%; background: linear-gradient(135deg, transparent 50%, #ff6b8a 51% 100%); }
    .bookmark-card b { font-size: .72rem; letter-spacing: .16em; writing-mode: vertical-rl; }
    .bookmark-card strong { font-size: 1.8rem; line-height: 1; }
    .bookmark-card small { font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; }

    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .intro { text-align: center; margin: auto; } p { margin-left: auto; margin-right: auto; } .hint { justify-content: center; } .book-wrap { margin: auto; } }
    @media (max-width: 700px) { .scene { padding: 1.25rem 1rem 2rem; } .field-row { grid-template-columns: 1fr; } .item { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="layout">
      <section class="intro">
        <div class="eyebrow">A little place to pause</div>
        <h1>Mark your <span>moment.</span></h1>
        <p>A tactile, dimensional bookmark for the stories worth returning to. Move your cursor over the book to explore its depth.</p>
        <div class="hint">Hover to rotate the scene</div>
      </section>

      <section class="panel" aria-label="Bookmark manager">
        <div class="panel-header"><h2>Bookmark list</h2><span class="pill" id="countPill">0 saved</span></div>
        <form id="bookmarkForm">
          <div class="field-row">
            <label>Title<input id="title" type="text" placeholder="Deep work" required /></label>
            <label>Category<input id="category" type="text" placeholder="Productivity" /></label>
          </div>
          <label>URL<input id="url" type="url" placeholder="https://example.com" required /></label>
          <div class="actions"><button class="btn btn-primary" type="submit" id="submitBtn">Save bookmark</button><button class="btn btn-secondary" type="button" id="resetBtn">Clear form</button></div>
        </form>
        <ul class="list" id="bookmarkList" aria-live="polite"></ul>
      </section>

      <section class="book-wrap" aria-label="A 3D open book with a bookmark">
        <div class="book-shadow"></div><div class="book"><div class="pages"></div><div class="spine"></div><div class="cover"></div><div class="ribbon"></div><div class="bookmark-card"><b>READ · DREAM · RETURN</b><strong>✦</strong><small>chapter one</small></div></div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'bookmark-crud-v1';
    const form = document.getElementById('bookmarkForm');
    const titleInput = document.getElementById('title');
    const categoryInput = document.getElementById('category');
    const urlInput = document.getElementById('url');
    const list = document.getElementById('bookmarkList');
    const countPill = document.getElementById('countPill');
    const submitBtn = document.getElementById('submitBtn');
    let editingId = null;

    function uid() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`; }
    function readEntries() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    function saveEntries(entries) { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    function escapeHTML(value = '') { return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function normalizeUrl(value) { return /^https?:\/\//i.test(value) ? value : `https://${value}`; }

    function resetForm() { form.reset(); editingId = null; submitBtn.textContent = 'Save bookmark'; }

    function renderEntries() {
      const entries = readEntries();
      countPill.textContent = `${entries.length} saved`;
      list.innerHTML = entries.length ? entries.map((entry) => `
        <li class="item"><div class="item-main"><div class="item-title">${escapeHTML(entry.title)}</div><a class="item-link" href="${escapeHTML(entry.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(entry.url)}</a><div class="item-meta">${escapeHTML(entry.category || 'General')}</div></div><div class="item-actions"><button class="btn btn-secondary" type="button" data-action="edit" data-id="${entry.id}">Edit</button><button class="btn btn-danger" type="button" data-action="delete" data-id="${entry.id}">Delete</button></div></li>
      `).join('') : '<li class="empty-state">No bookmarks saved yet. Add your first favorite page.</li>';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const category = categoryInput.value.trim() || 'General';
      const url = normalizeUrl(urlInput.value.trim());
      if (!title || !urlInput.value.trim()) return;
      const entries = readEntries();
      if (editingId) {
        saveEntries(entries.map((entry) => entry.id === editingId ? { ...entry, title, category, url } : entry));
      } else {
        saveEntries([{ id: uid(), title, category, url }, ...entries]);
      }
      resetForm();
      renderEntries();
    });

    list.addEventListener('click', (event) => {
      const { action, id } = event.target.dataset;
      if (!action || !id) return;
      const entries = readEntries();
      const item = entries.find((entry) => entry.id === id);
      if (!item) return;
      if (action === 'edit') {
        editingId = id;
        titleInput.value = item.title;
        categoryInput.value = item.category || '';
        urlInput.value = item.url;
        submitBtn.textContent = 'Update bookmark';
        titleInput.focus();
      } else if (action === 'delete') {
        saveEntries(entries.filter((entry) => entry.id !== id));
        if (editingId === id) resetForm();
        renderEntries();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', resetForm);
    if (!localStorage.getItem(STORAGE_KEY)) saveEntries([{ id: uid(), title: 'Design Systems', category: 'Inspiration', url: 'https://www.smashingmagazine.com/' }, { id: uid(), title: 'CSS Tricks', category: 'Reference', url: 'https://css-tricks.com/' }]);
    renderEntries();
  </script>
</body>
</html>
